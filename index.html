lass="rowmeta"><b>${b===null?'—':Math.round(b)+'%'}</b><small>điểm cao nhất</small></div><button class="btn small" data-act="open" data-id="${esc(e.id)}">Mở</button></div>`}function empty(icon,title,desc,button,act){return `<div class="empty"><div class="ei">${icon}</div><b>${esc(title)}</b><p>${esc(desc)}</p>${button?`<button class="btn primary" data-act="${act}">${esc(button)}</button>`:''}</div>`}function activities(){let a=S.attempts.slice().sort((x,y)=>new Date(y.finishedAt)-new Date(x.finishedAt)).slice(0,5);return a.length?a.map(x=>`<div class="listrow"><div class="subject">${x.practice?'↻':'✓'}</div><div class="rowinfo"><b>${esc(x.title)}</b><small>${x.practice?'Lượt luyện':`Bài thi · ${x.gradedMax?Math.round(100*x.gradedScore/x.gradedMax)+'%':'chưa chấm đủ'}`} · ${dt(x.finishedAt)}</small></div></div>`).join(''):empty('◷','Chưa có hoạt động','Lịch sử làm bài sẽ xuất hiện tại đây.')}function weak(){let a=[];S.exams.forEach(e=>e.questions.forEach(q=>{let z=S.qstats[sk(e,q)];if(z&&(z.wrong>0||z.pending>0))a.push({e,q,z})}));return a.sort((x,y)=>(n(y.z.wrong)*2+n(y.z.pending)-n(y.z.correct)*.2)-(n(x.z.wrong)*2+n(x.z.pending)-n(x.z.correct)*.2))}

function create(){if(!draft)draft={mode:'new',title:'',subject:'',topic:'',description:'',duration:n(S.settings.defaultDuration),text:'',parsed:null};return `<div class="pagehead"><div><div class="eyebrow">BIẾN TÀI LIỆU THÀNH BÀI LUYỆN</div><h1>${draft.mode==='edit'?'Chỉnh sửa đề':'Tạo đề mới'}</h1><p>Dán JSON do ChatGPT hoặc Claude tạo từ ảnh bài tập. Website kiểm tra dữ liệu trước khi lưu và không thực thi JavaScript được dán vào.</p></div><button class="btn" data-act="sample">Xem định dạng mẫu</button></div><div class="creategrid"><div class="panel"><div class="sectionhead" style="margin-top:0"><div><h2>01 — Thông tin đề</h2><p>Điền hoặc điều chỉnh thông tin cơ bản.</p></div></div><div class="formgrid"><div class="field"><label>Tên đề *</label><input class="input" id="dTitle" value="${esc(draft.title)}" placeholder="Ví dụ: Ôn tập chương 2"></div><div class="field"><label>Môn học</label><input class="input" id="dSubject" value="${esc(draft.subject)}" placeholder="Toán, Lịch sử…"></div><div class="field"><label>Chủ đề / chương</label><input class="input" id="dTopic" value="${esc(draft.topic)}" placeholder="Ví dụ: Phân thức đại số"></div><div class="field"><label>Thời lượng (phút)</label><input type="number" min="0" max="600" class="input" id="dDuration" value="${esc(draft.duration||0)}"><small>Nhập 0 nếu không giới hạn.</small></div><div class="field span2"><label>Mô tả</label><input class="input" id="dDesc" value="${esc(draft.description)}" placeholder="Phạm vi ôn tập…"></div></div><div class="divider"></div><div class="sectionhead" style="margin-top:0"><div><h2>02 — Dữ liệu đề thi (JSON)</h2><p>Chỉ nhận JSON hợp lệ, không phải mã JavaScript.</p></div><span class="pill" id="chars">${draft.text.length} ký tự</span></div><textarea id="jsonInput" class="textarea code" spellcheck="false" placeholder='Dán JSON chứa trường "questions" vào đây…'>${esc(draft.text)}</textarea><div id="validation"></div><div class="actions" style="margin-top:13px"><button class="btn" data-a function norm(x){return String(x??'').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi')}function seteq(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&a.every(x=>b.includes(x))}function grade(q,a){let p=n(q.points,1);if(!has(a))return{status:'wrong',score:0,maxScore:p,feedback:'Bạn chưa trả lời câu này.'};if(['multiple_choice','multiple_select','true_false'].includes(q.type)){let exp=(q.correctAnswers||[]).map(String);if(q.type==='true_false'&&!exp.length&&q.correctAnswer!==undefined)exp=[String(q.correctAnswer).toLowerCase()];let act=q.type==='multiple_select'?(Array.isArray(a)?a.map(String):[]):[String(a)];let ok=q.type==='multiple_choice'?act[0]===exp[0]:seteq(act,exp);if(!ok&&q.type==='multiple_select'&&q.partialCredit===true&&act.length&&act.every(x=>exp.includes(x))){let sc=p*act.length/Math.max(1,exp.length);return{status:'partial',score:sc,maxScore:p,feedback:q.explanation||'Bạn đã chọn đúng một phần đáp án.'}}return{status:ok?'correct':'wrong',score:ok?p:0,maxScore:p,feedback:q.explanation||(ok?'Chính xác!':'Chưa chính xác. Hãy xem lại kiến thức liên quan.')}}if(q.type==='fill_text'){let exp=q.acceptedAnswers||(q.answer!==undefined?[String(q.answer)]:[]);let ok=exp.some(x=>q.caseSensitive?String(x).trim()===String(a).trim():norm(x)===norm(a));return{status:ok?'correct':'wrong',score:ok?p:0,maxScore:p,feedback:q.explanation||(ok?'Chính xác!':'Hãy kiểm tra lại đáp án.')}}if(q.type==='fill_number'){let exp=q.acceptedValues||(q.answer!==undefined?[q.answer]:[]),v=Number(a),tol=Math.max(0,n(q.tolerance));let ok=Number.isFinite(v)&&exp.some(x=>Number.isFinite(Number(x))&&Math.abs(v-Number(x))<=tol);return{status:ok?'correct':'wrong',score:ok?p:0,maxScore:p,feedback:q.explanation||(ok?'Chính xác!':'Đáp số chưa đúng hoặc chưa nằm trong sai số cho phép.')}}return{status:'pending',score:null,maxScore:p,feedback:'Câu tự luận cần được đánh giá theo nội dung.'}}
async function submit(auto=false){let s=S.session;if(!s||s.result)return;let left=s.order.filter(id=>!has(s.answers[id]));if(left.length&&!auto){showModal('Bạn còn câu chưa trả lời',`<p>Bạn chưa trả lời <b>${left.length} câu</b>. Bạn muốn quay lại làm tiếp hay nộp bài?</p>`,[{label:'Làm tiếp'},{label:'Nộp bài',primary:true,fn:()=>{finalize(s,false)}}]);return}await finalize(s,auto)}async function finalize(s,auto){let e=S.exams.find(x=>x.id===s.examId);if(!e)return;let qs=s.order.map(id=>e.questions.find(q=>q.id===id)).filter(Boolean),g={};for(let q of qs)g[q.id]=grade(q,s.answers[q.id]);let essays=qs.filter(q=>q.type==='essay'&&has(s.answers[q.id]));if(essays.length&&apiKey&&S.settings.endpoint&&S.settings.model){for(let q of essays){try{g[q.id]=await gradeAI(e,q,s.answers[q.id])}catch(err){g[q.id]={status:'pending',score:null,maxScore:n(q.points,1),feedback:'Chưa thể chấm tự luận: '+String(err.message).slice(0,220)+'. Câu trả lời đã được giữ lại.',needsReview:true}}}}let score=0,max=0,pending=0;for(let q of qs){let x=g[q.id];if(x.score===null||x.score===undefined)pending++;else{score+=n(x.score);max+=n(x.maxScore,q.points)}}let now=new Date().toISOString();let r={id:s.id,examId:s.examId,title:s.title,practice:s.practice,startedAt:s.startedAt,finishedAt:now,answers:copy(s.answers),graded:g,order:s.order.slice(),marked:s.marked.slice(),maxScore:pts({questions:qs}),gradedScore:score,gradedMax:max,pendingCount:pending,autoSubmitted:auto,durationSeconds:Math.floor((Date.now()-s.startedMs)/1000)};s.result=r;S.attempts.unshift(r);for(let q of qs){let x=g[q.id],k=sk(e,q),st=S.qstats[k]||{examId:e.id,questionId:q.id,attempts:0,correct:0,wrong:0,pending:0};if(x.status==='correct'){st.attempts++;st.correct++}else if(x.status==='wrong'||x.status==='partial'){st.attempts++;st.wrong++}else st.pending++;st.lastAttempt=now;st.lastFeedback=x.feedback;S.qstats[k]=st}await save();nav('results')}
async function gradeAI(e,q,ans){let res=await fetch(S.settings.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:S.settings.model,temperature:.1,messages:[{role:'system',content:'Bạn là giáo viên chấm bài công bằng. Đánh giá theo ý nghĩa, không so khớp từ khóa. Không suy đoán ý chưa trình bày. Trả về JSON hợp lệ bằng tiếng Việt.'},{role:'user',content:JSON.stringify({question:q.prompt,studentAnswer:ans,subject:e.subject,topic:e.topic,referenceAnswer:q.referenceAnswer||null,keyPoints:q.keyPoints||[],gradingRubric:q.gradingRubric||null,maxScore:q.points,requiredOutput:{score:'number 0..maxScore or null',verdict:'correct|partially_correct|incorrect|needs_review',correctPoints:[],missingPoints:[],incorrectClaims:[],feedback:'string',confidence:'0..1',needsReview:'boolean'}})}],response_format:{type:'json_object'}})});if(!res.ok)throw Error('API trả HTTP '+res.status+'. Kiểm tra endpoint, model, khóa API hoặc CORS.');let content=(await res.json()).choices?.[0]?.message?.content;if(typeof content!=='string')throw Error('Phản hồi AI thiếu nội dung.');let x;try{x=JSON.parse(content.replace(/^```json\s*/,'').replace(/```$/,'').trim())}catch{throw Error('AI trả về JSON sai định dạng.')}let max=n(q.points,1);if(x.needsReview||x.verdict==='needs_review'||n(x.confidence)<.55||x.score===null||!Number.isFinite(Number(x.score)))return{status:'pending',score:null,maxScore:max,feedback:x.feedback||'AI chưa đủ chắc chắn; cần xem lại thủ công.',needsReview:true};let score=Math.max(0,Math.min(max,Number(x.score)));return{status:score>=max?'correct':score>0?'partial':'wrong',score,maxScore:max,feedback:String(x.feedback||'Đã đánh giá theo nội dung.'),correctPoints:x.correctPoints||[],missingPoints:x.missingPoints||[],incorrectClaims:x.incorrectClaims||[],confidence:n(x.confidence),needsReview:!!x.needsReview}}

function settingsPage(){let s=S.settings,tabs=[['general','Chung'],['ai','Chấm tự luận bằng AI'],['data','Dữ liệu & sao lưu']];let body='';if(section==='general')body=`${[['Giao diện tối','Giảm độ sáng nền','stTheme',s.theme==='dark'],['Xáo trộn câu hỏi mặc định','Thứ tự câu thay đổi trong mỗi lượt thi','stShuffleQ',s.shuffleQ],['Xáo trộn phương án','Đáp án đúng được giữ theo ID','stShuffleO',s.shuffleO]].map(x=>`<div class="settingrow"><div><b>${x[0]}</b><p>${x[1]}</p></div><input type="checkbox" id="${x[2]}" ${x[3]?'checked':''}></div>`).join('')}<div class="settingrow"><div><b>Thời lượng mặc định (phút)</b><p>Đặt 0 nếu không giới hạn.</p></div><input id="stDuration" type="number" min="0" max="600" class="input" style="max-width:100px" value="${n(s.defaultDuration)}"></div><button class="btn primary" data-act="save-settings">Lưu cài đặt</button>`;else if(section==='ai')body=`<div class="notice warn"><b>Lưu ý bảo mật:</b> API key chỉ giữ trong bộ nhớ tab, không ghi vào kho dữ liệu. Tuy vậy, khi gọi API từ trình duyệt, khóa vẫn có thể lộ qua tiện ích mở rộng hoặc mã độc. Không triển khai công khai bằng cách này; hãy dùng backend/proxy bảo vệ khóa.</div><div class="field"><label>API endpoint tương thích Chat Completions</label><input class="input" id="aiEndpoint" value="${esc(s.endpoint||'https://api.openai.com/v1/chat/completions')}" placeholder="https://.../v1/chat/completions"></div><div class="field"><label>Tên mô hình</label><input class="input" id="aiModel" class="input" value="${esc(s.model||'')}" placeholder="Tên model từ nhà cung cấp"></div><div class="field"><label>API key (chỉ giữ trong bộ nhớ)</label><input class="input" id="aiKey" type="password" autocomplete="off" value="${esc(apiKey)}" placeholder="Dán khóa API"><small>Khóa bị xóa khỏi bộ nhớ khi tải lại trang.</small></div><div class="actions"><button class="btn primary" data-act="save-settings">Lưu cấu hình</button><button class="btn" data-act="test-ai">Kiểm tra kết nối</button><button class="btn dan function bind(){const root=$('#view');root.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>act(el));if(viewName==='create'){let ta=$('#jsonInput');ta?.addEventListener('input',()=>$('#chars').textContent=ta.value.length+' ký tự');}if(viewName==='library'){let filter=()=>{let q=($('#search').value||'').toLowerCase().trim(),sub=$('#subjectFilter').value,sort=$('#sort').value;let es=S.exams.filter(e=>(!sub||e.subject===sub)&&[e.title,e.subject,e.topic,e.description].some(x=>(x||'').toLowerCase().includes(q)));if(sort==='title')es.sort((a,b)=>a.title.localeCompare(b.title,'vi'));else if(sort==='created')es.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));else if(sort==='score')es.sort((a,b)=>(best(b)??-1)-(best(a)??-1));else es.sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));$('#examCards').innerHTML=cards(es);bind()};$('#search')?.addEventListener('input',filter);$('#subjectFilter')?.addEventListener('change',filter);$('#sort')?.addEventListener('change',filter)}}
function act(el){let a=el.dataset.act,id=el.dataset.id;switch(a){case'home':nav('home');break;case'new':newDraft();break;case'library':nav('library');break;case'practice':nav('practice');break;case'stats':nav('stats');break;case'settings':nav('settings');break;case'open':examId=id;nav('detail');break;case'create':nav('create');break;case'validate':readDraft();validationUI(false);break;case'preview':readDraft();validationUI(true);break;case'sample':readDraft();if(!draft.text.trim()){draft.text=JSON.stringify(sample,null,2);draft.title=sample.title;draft.subject=sample.subject;draft.topic=sample.topic;draft.duration=sample.durationMinutes;nav('create')}else showModal('Ví dụ JSON',`<p>Dùng mẫu này để thử bộ kiểm tra. Đây chỉ là ví dụ, không tự động thêm vào kho.</p><textarea class="textarea code" id="sampleText">${esc(JSON.stringify(sample,null,2))}</textarea>`,[{label:'Đóng'},{label:'Dùng mẫu',primary:true,fn:()=>{draft.text=$('#sampleText').value;draft.title=draft.title||sample.title;draft.subject=draft.subject||sample.subject;draft.topic=draft.topic||sample.topic;nav('create')}}]);break;case'clear-draft':showModal('Làm trống biểu mẫu?',`<p>Nội dung đang nhập sẽ bị xóa khỏi biểu mẫu. Đề đã lưu không bị ảnh hưởng.</p>`,[{label:'Giữ lại'},{label:'Làm trống',danger:true,fn:()=>{draft={mode:'new',title:'',subject:'',topic:'',description:'',duration:0,text:'',parsed:null};nav('create')}}]);break;case'save-draft':saveDraft();break;case'addq':if(!draft.parsed&&!validationUI(true))return;draft.parsed.questions.push({id:uniqQ(draft.parsed.questions),type:'multiple_choice',prompt:'Nội dung câu hỏi mới',options:[{id:'A',text:'Phương án A'},{id:'B',text:'Phương án B'}],correctAnswers:['A'],points:1});syncDraft();toast('Đã thêm câu hỏi. Hãy sửa nội dung trước khi lưu.','success');break;case'editq':editQuestion(n(el.dataset.i));break;case'removeq':{let i=n(el.dataset.i);showModal('Xóa câu hỏi?',`<p>Câu này sẽ bị loại khỏi bản nháp. Đề đang lưu chưa bị ảnh hưởng.</p>`,[{label:'Hủy'},{label:'Xóa câu',danger:true,fn:()=>{draft.parsed.questions.splice(i,1);syncDraft();toast('Đã xóa câu khỏi bản nháp.','success')}}]);break}case'sync-json':syncDraft();toast('Đã cập nhật JSON từ phần chỉnh sửa.','success');break;case'edit':editExam(id);break;case'menu':examMenu(id);break;case'delete':deleteExam(id);break;case'duplicate':duplicateExam(id);break;case'favorite':toggleFav(id);break;case'export-exam':exportExam(id);break;case'export-all':exportAll();break;case'import':$('#fileImport').click();break;case'start':startQuiz(id);break;case'shuffle-start':startQuiz(id,{shuffle:true});break;case'practice-exam':startQuiz(id,{practice:true});break;case'retry-wrong':startPractice(id);break;case'one':startQuiz(id,{practice:true,ids:[el.dataset.q],shuffle:false});break;case'resume':nav('quiz');break;case'next':move(1);break;case'prev':move(-1);break;case'jump':jump(n(el.dataset.i));break;case'mark':{let s=S.session,qid=s.order[s.index],i=s.marked.indexOf(qid);i<0?s.marked.push(qid):s.marked.splice(i,1);save().then(render);break}case'submit':submit(false);break;case'done':S.session=null;save().then(()=>nav('home'));break;case'backdetail':examId=id;nav('detail');break;case'manual':manual(el.dataset.q);break;case'retryai':retryAI(el.dataset.q);break;case'practice-mode':startPractice(el.dataset.mode);break;case'set-section':section=el.dataset.section;nav('settings');break;case'save-settings':saveSettings();break;case'test-ai':testAI();break;case'clear-key':apiKey='';if($('#aiKey'))$('#aiKey').value='';toast('Đã xóa khóa API khỏi bộ nhớ tab.');break;case'clear-data':clearData();break;}}
function syncDraft(){let d=draft.parsed;draft.text=JSON.stringify({schemaVersion:1,title:draft.title,subject:draft.subject,topic:draft.topic,description:draft.description,durationMinutes:draft.duration,grade:d.grade,difficulty:d.difficulty,tags:d.tags,questions:d.questions},null,2);$('#jsonInput').value=draft.text;$('#chars').textContent=draft.text.length+' ký tự';$('#draftPreview').innerHTML=previewDraft();bind()}
function uniqQ(qs){let i=qs.length+1;while(qs.some(q=>q.id==='q'+i))i++;return'q'+i}
function editQuestion(i){
 let q=draft?.parsed?.questions?.[i]; if(!q)return;
 let opts=q.options||[];
 let advanced=Object.fromEntries(Object.entries(q).filter(([k])=>!['id','type','prompt','points','options','correctAnswers','referenceAnswer','keyPoints','gradingRubric','explanation','imageUrl'].includes(k)));
 let body=`<div class="formgrid">
 <div class="field"><label>ID câu</label><input id="qeId" class="input" value="${esc(q.id)}"></div>
 <div class="field"><label>Loại câu</label><select id="qeType" class="select">${['multiple_choice','multiple_select','true_false','fill_text','fill_number','essay'].map(t=>`<option value="${t}" ${q.type===t?'selected':''}>${label(t)}</option>`).join('')}</select></div>
 <div class="field span2"><label>Nội dung câu hỏi</label><textarea id="qePrompt" class="textarea">${esc(q.prompt)}</textarea></div>
 <div class="field"><label>Điểm</label><input id="qePoints" class="input" type="number" min="0" step="0.25" value="${n(q.points,1)}"></div>
 <div class="field"><label>URL hình minh họa (tùy chọn)</label><input id="qeImage" class="input" value="${esc(q.imageUrl||'')}"></div>
 <div class="field span2" id="qeOptWrap"><label>Phương án (mỗi dòng: ID|nội dung)</label><textarea id="qeOpts" class="textarea" rows="4">${esc(opts.map(o=>o.id+'|'+o.text).join('\n'))}</textarea><label>Đáp án đúng (ID cách nhau bằng dấu phẩy; Đúng/Sai dùng true hoặc false)</label><input id="qeCorrect" class="input" value="${esc((q.correctAnswers||[]).join(', '))}"></div>
 <div class="field span2" id="qeEssayWrap"><label>Đáp án tham khảo</label><textarea id="qeRef" class="textarea" rows="3">${esc(q.referenceAnswer||'')}</textarea><label>Ý chính cần đạt (mỗi dòng một ý)</label><textarea id="qeKeys" class="textarea" rows="3">${esc((q.keyPoints||[]).join('\n'))}</textarea><label>Tiêu chí chấm</label><textarea id="qeRubric" class="textarea">${esc(q.gradingRubric||'')}</textarea></div>
 <div class="field span2"><label>Giải thích đáp án</label><textarea id="qeExplain" class="textarea">${esc(q.explanation||'')}</textarea></div>
 <div class="field span2"><label>Trường nâng cao dạng JSON (acceptedAnswers, answer, tolerance, partialCredit…)</label><textarea id="qeAdvanced" class="textarea" rows="3">${esc(JSON.stringify(advanced,null,2)==='{}'?'':JSON.stringify(advanced,null,2))}</textarea></div></div>`;
 showModal('Sửa câu '+(i+1),body,[{label:'Hủy'},{label:'Lưu câu',primary:true,fn:()=>{
  try {
   let type=$('#qeType').value,id=$('#qeId').value.trim(),prompt=$('#qePrompt').value.trim(),points=n($('#qePoints').value,-1);
   if(!id||!prompt||points<0)throw Error('ID, nội dung và điểm số phải hợp lệ.');
   if(draft.parsed.questions.some((x,j)=>j!==i&&x.id===id))throw Error('ID câu hỏi bị trùng.');
   let u={id,type,prompt,points,explanation:$('#qeExplain').value.trim()}; let img=$('#qeImage').value.trim(); if(img)u.imageUrl=img;
   if(['multiple_choice','multiple_select'].includes(type)){
    u.options=$('#qeOpts').value.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{let k=x.indexOf('|');return k<0?{id:x,text:x}:{id:x.slice(0,k).trim(),text:x.slice(k+1).trim()};});
    u.correctAnswers=$('#qeCorrect').value.split(',').map(x=>x.trim()).filter(Boolean);
   } else if(type==='true_false'){
    u.options=[{id:'true',text:'Đúng'},{id:'false',text:'Sai'}];
    u.correctAnswers=$('#qeCorrect').value.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
    if(!u.correctAnswers.length)throw Error('Câu Đúng/Sai cần đáp án true hoặc false.');
   } else if(type==='essay'){
    u.referenceAnswer=$('#qeRef').value.trim();u.keyPoints=$('#qeKeys').value.split('\n').map(x=>x.trim()).filter(Boolean);u.gradingRubric=$('#qeRubric').value.trim();
   }
   let adv=$('#qeAdvanced').value.trim();if(adv){let obj=JSON.parse(adv);if(!obj||Array.isArray(obj)||typeof obj!=='object')throw Error('Trường nâng cao phải là đối tượng JSON.');u={...u,...obj,id,type,prompt,points};}
   draft.parsed.questions[i]=u;syncDraft();toast('Đã cập nhật câu hỏi.','success');
  } catch(e){toast(e.message||'Không thể lưu câu hỏi.','error');return false;}
 }}]);
 $('#qeType').onchange=()=>{let type=$('#qeType').value;$('#qeOptWrap').classList.toggle('hidden',!['multiple_choice','multiple_select','true_false'].includes(type));$('#qeEssayWrap').classList.toggle('hidden',type!=='essay');};
}
function saveDraft(){readDraft();if(!draft.text.trim()){toast('Hãy dán JSON trước khi tạo đề.','error');return}if(!validationUI(true))return;if(!draft.title){toast('Hãy nhập tên đề.','error');$('#dTitle').focus();return}let x=draft.parsed;x.title=draft.title;x.subject=draft.subject;x.topic=draft.topic;x.description=draft.description;x.durationMinutes=draft.duration;if(draft.mode==='edit'){let old=S.exams.find(e=>e.id===draft.examId);if(old){x.id=old.id;x.createdAt=old.createdAt;x.favorite=old.favorite;x.updatedAt=new Date().toISOString();S.exams[S.exams.findIndex(e=>e.id===old.id)]=x;save().then(()=>{examId=x.id;draft=null;nav('detail');toast('Đã cập nhật đề. Lịch sử trước đó vẫn được giữ.','success')});return}}let same=S.exams.find(e=>e.title.toLowerCase()===x.title.toLowerCase()&&e.subject===x.subject);if(same){showModal('Đề có vẻ đã tồn tại',`<p>Đã có đề <b>${esc(same.title)}</b> trong kho. Chọn cách xử lý.</p><p class="sm">Cập nhật sẽ giữ ID đề; lịch sử cũ vẫn được giữ lại.</p>`,[{label:'Hủy'},{label:'Tạo bản mới',primary:true,fn:()=>addNewExam(x)},{label:'Cập nhật đề cũ',fn:()=>{x.id=same.id;x.createdAt=same.createdAt;x.favorite=same.favorite;x.updatedAt=new Date().toISOString();S.exams[S.exams.findIndex(e=>e.id===same.id)]=x;save().then(()=>{examId=x.id;draft=null;nav('detail');toast('Đã cập nhật đề.','success')})}}]);return}addNewExam(x)}function addNewExam(x){x.id=uid('exam');x.createdAt=new Date().toISOString();x.updatedAt=x.createdAt;S.exams.unshift(x);save().then(()=>{examId=x.id;draft=null;nav('detail');toast('Đã tạo đề và lưu vào kho.','success')})}
function editExam(id){let e=S.exams.find(x=>x.id===id);if(!e)return;draft={mode:'edit',examId:id,createdAt:e.createdAt,favorite:e.favorite,title:e.title,subject:e.subject,topic:e.topic,description:e.description,duration:e.durationMinutes,text:JSON.stringify({schemaVersion:1,title:e.title,subject:e.subject,topic:e.topic,description:e.description,durationMinutes:e.durationMinutes,grade:e.grade,difficulty:e.difficulty,tags:e.tags,questions:e.questions},null,2),parsed:null};nav('create')}
function examMenu(id){let e=S.exams.find(x=>x.id===id);if(!e)return;showModal(e.title,`<p class="muted">${e.questions.length} câu · ${esc(e.subject||'Chưa phân môn')}</p><div class="cards"><button class="btn" data-choice="edit">✎ Chỉnh sửa</button><button class="btn" data-choice="favorite">${e.favorite?'☆ Bỏ yêu thích':'★ Đánh dấu yêu thích'}</button><button class="btn" data-choice="duplicate">▣ Nhân bản đề</button><button class="btn" data-choice="export">⇩ Xuất JSON</button><button class="btn danger" data-choice="delete">× Xóa đề</button></div>`,[{label:'Đóng'}]);$$('[data-choice]').forEach(b=>b.onclick=()=>{closeModal();let c=b.dataset.choice;if(c==='edit')editExam(id);if(c==='favorite')toggleFav(id);if(c==='duplicate')duplicate(id);if(c==='export')exportExam(id);if(c==='delete')deleteExam(id)})}function toggleFav(id){let e=S.exams.find(x=>x.id===id);if(!e)return;e.favorite=!e.favorite;e.updatedAt=new Date().toISOString();save().then(()=>{toast(e.favorite?'Đã thêm vào yêu thích.':'Đã bỏ yêu thích.','success');render()})}function duplicate(id){let e=S.exams.find(x=>x.id===id);if(!e)return;let x=copy(e);x.id=uid('exam');x.title+=' (bản sao)';x.favorite=false;x.createdAt=x.updatedAt=new Date().toISOString();S.exams.unshift(x);save().then(()=>{examId=x.id;nav('detail');toast('Đã nhân bản đề.','success')})}function deleteExam(id){let e=S.exams.find(x=>x.id===id);if(!e)return;showModal('Xóa đề này?',`<div class="notice warn">Bạn sắp xóa <b>${esc(e.title)}</b> và ${e.questions.length} câu hỏi. Lịch sử bài làm vẫn được giữ nhưng đề sẽ không còn trong kho. Thao tác không thể hoàn tác.</div><p>Hãy xuất đề trước nếu muốn giữ một bản sao.</p>`,[{label:'Hủy'},{label:'Xóa đề',danger:true,fn:()=>{S.exams=S.exams.filter(x=>x.id!==id);if(S.session?.examId===id&&!S.session.result)S.session=null;save().then(()=>{toast('Đã xóa đề.','success');if(examId===id)nav('library');else render()})}}])}
function exportExam(id){let e=S.exams.find(x=>x.id===id);if(!e)return;let obj={schemaVersion:1,title:e.title,subject:e.subject,topic:e.topic,description:e.description,durationMinutes:e.durationMinutes,grade:e.grade,difficulty:e.difficulty,tags:e.tags,questions:e.questions};download(JSON.stringify(obj,null,2),slug(e.title)+'.json','application/json');toast('Đã xuất đề thành JSON.','success')}function exportAll(){let s=copy(S);s.settings.endpoint=S.settings.endpoint;s.settings.model=S.settings.model;delete s.settings.apiKey;download(JSON.stringify({app:'OnThongMinh',backupVersion:1,exportedAt:new Date().toISOString(),state:s},null,2),'on-thong-minh-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json');toast('Đã tạo tệp sao lưu.','success')}function slug(x){return String(x||'de-thi').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,75)||'de-thi'}function download(text,name,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1200)}
async function retryAI(qid){let r=S.session?.result,e=S.exams.find(e=>e.id===r?.examId),q=e?.questions.find(q=>q.id===qid);if(!r||!q)return;if(!apiKey||!S.settings.endpoint||!S.settings.model){toast('Hãy nhập API key trong Cài đặt trước.','error');section='ai';nav('settings');return}showModal('Đang chấm lại',`<p>Câu trả lời sẽ được giữ nguyên nếu API gặp lỗi.</p><div class="notice">Đang chờ phản hồi từ endpoint AI…</div>`,[{label:'Đóng'}]);try{let g=await gradeAI(e,q,r.answers[qid]);r.graded[qid]=g;recalc(r,e);let i=S.attempts.findIndex(x=>x.id===r.id);if(i>=0)S.attempts[i]=copy(r);await save();closeModal();nav('results');toast('Đã cập nhật kết quả chấm AI.','success')}catch(err){closeModal();toast(err.message||'Không thể chấm lại.','error')}}
function saveSettings(){if(section==='general'){S.settings.theme=$('#stTheme')?.checked?'dark':'light';S.settings.shuffleQ=!!$('#stShuffleQ')?.checked;S.settings.shuffleO=!!$('#stShuffleO')?.checked;S.settings.defaultDuration=Math.max(0,Math.min(600,n($('#stDuration')?.value)));applyTheme();save().then(()=>toast('Đã lưu cài đặt.','success'))}else if(section==='ai'){let endpoint=$('#aiEndpoint')?.value.trim(),model=$('#aiModel')?.value.trim(),key=$('#aiKey')?.value.trim();if(!endpoint||!/^https?:\/\//i.test(endpoint)){toast('Endpoint phải là URL bắt đầu bằng http:// hoặc https://.','error');return}if(!model){toast('Hãy nhập tên mô hình.','error');return}S.settings.endpoint=endpoint;S.settings.model=model;if(key)apiKey=key;save().then(()=>toast('Đã lưu endpoint và model. API key chỉ nằm trong bộ nhớ tab.','success'))}}async function testAI(){saveSettings();if(!apiKey||!S.settings.endpoint||!S.settings.model){toast('Cần endpoint, tên model và API key.','error');return}let box=$('#aiStatus');if(box)box.textContent='Đang kiểm tra endpoint…';try{let r=await fetch(S.settings.endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},body:JSON.stringify({model:S.settings.model,messages:[{role:'user',content:'Trả về JSON {"ok":true}'}],response_format:{type:'json_object'},temperature:0})});if(!r.ok)throw Error('Máy chủ trả HTTP '+r.status+'. Kiểm tra model, key, endpoint và CORS.');if(box){box.className='notice ok';box.textContent='Endpoint đã phản hồi. Điều này chỉ xác nhận API chấp nhận yêu cầu thử, chưa đảm bảo mọi lần chấm đều chính xác.'}toast('API đã phản hồi.','success')}catch(e){if(box){box.className='notice error';box.textContent='Không kiểm tra được: '+e.message+'. Trình duyệt có thể chặn CORS; một số nhà cung cấp không cho gọi API trực tiếp từ HTML.'}toast('Không kết nối được AI.','error')}}function clearData(){showModal('Xóa toàn bộ dữ liệu?',`<div class="notice error"><b>Không thể hoàn tác.</b> Toàn bộ ${S.exams.length} đề, ${S.attempts.length} lượt làm bài và thống kê sẽ bị xóa.</div><p>Hãy xuất bản sao lưu trước nếu muốn giữ dữ liệu.</p>`,[{label:'Hủy'},{label:'Xóa tất cả',danger:true,fn:()=>{S=copy(DEF);apiKey='';draft=null;save().then(()=>{applyTheme();nav('home');toast('Đã xóa dữ liệu cục bộ.','success')})}}])}
$('#fileImport').addEventListener('change',async ev=>{let f=ev.target.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text()),full=obj.state&&Array.isArray(obj.state.exams),incoming=Array.isArray(obj)?obj:full?obj.state.exams:Array.isArray(obj.exams)?obj.exams:obj.questions?[obj]:null;if(!incoming)throw Error('Không tìm thấy danh sách đề trong JSON.');let valid=[],errors=[];incoming.forEach((raw,i)=>{if(!raw||!Array.isArray(raw.questions)){errors.push('Mục '+(i+1)+': thiếu questions.');return}let v=validate(JSON.stringify({...raw,schemaVersion:raw.schemaVersion||1}));if(!v.ok){errors.push('Mục '+(i+1)+': '+v.errors.slice(0,2).join(' '));return}valid.push(normalize(raw,{id:raw.id&&!S.exams.some(e=>e.id===raw.id)?raw.id:uid('exam'),createdAt:raw.createdAt,favorite:raw.favorite}))});if(!valid.length&&!full)throw Error(errors.slice(0,4).join('\n')||'Không có đề hợp lệ.');showModal('Nhập dữ liệu',`<p>Tệp có ${incoming.length} đề; ${valid.length} đề hợp lệ để nhập.</p>${errors.length?`<div class="notice warn"><b>Một số mục được bỏ qua:</b><ul>${errors.slice(0,5).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}${full?'<div class="notice warn">Đây là bản sao lưu đầy đủ. Bạn có thể khôi phục kho đề, lịch sử và thống kê, thay thế dữ liệu hiện tại.</div>':''}<p class="sm">Mặc định, các đề nhập sẽ được thêm dưới ID mới khi ID trùng để không ghi đè nhầm.</p>`,[{label:'Hủy'},{label:'Chỉ nhập đề',primary:true,fn:()=>{valid.forEach(x=>{if(S.exams.some(e=>e.id===x.id))x.id=uid('exam');S.exams.unshift(x)});save().then(()=>{nav('library');toast(`Đã nhập ${valid.length} đề.`,'success')})}},{label:'Khôi phục toàn bộ',danger:true,fn:()=>{if(!full){toast('Tệp này không phải bản sao lưu đầy đủ.','error');return false}if(!confirm('Khôi phục sẽ thay thế kho đề, lịch sử và thống kê hiện tại. Bạn đã sao lưu dữ liệu cần giữ chưa?'))return false;S=merge(obj.state);S.session=null;save().then(()=>{applyTheme();nav('home');toast('Đã khôi phục bản sao lưu.','success')})}}])}catch(e){showModal('Không thể nhập tệp',`<div class="notice error">${esc(e.message||'Tệp không đúng định dạng JSON.')}</div><p class="sm">Dùng JSON UTF-8 có trường questions hoặc tệp sao lưu do ứng dụng xuất ra.</p>`,[{label:'Đóng'}])}finally{ev.target.value=''}});
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(!b)return;let v=b.dataset.view;if(v==='create')newDraft();else if(v==='settings'){section='general';nav(v)}else nav(v)});$('#quickCreate').onclick=()=>newDraft();$('#theme').onclick=()=>{S.settings.theme=S.settings.theme==='dark'?'light':'dark';applyTheme();save();render()};
(async function boot(){await init();viewName=S.session&&!S.session.result?'quiz':'home';render();})();
</script></body></html>
